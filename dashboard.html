<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Live Dashboard - Leaderboard</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
    th { background-color: #3498db; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    .top-1 { font-weight: bold; background-color: #ffeaa7 !important; }
    .clear-btn { background-color: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; float: right; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
  <h2>🏆 Live Leaderboard Pelajar</h2>
  <button class="clear-btn" onclick="resetLeaderboard()">Reset Data</button>
  <div style="clear:both;"></div>

  <table>
    <thead>
      <tr>
        <th>Kedudukan</th>
        <th>Nama Pelajar</th>
        <th>Jumlah Markah</th>
        <th>Tahap Semasa</th>
        <th>Masa Kemas Kini</th>
      </tr>
    </thead>
    <tbody id="leaderboard-body">
      <tr><td colspan="5">Memuatkan data...</td></tr>
    </tbody>
  </table>
</div>

<script>
// === GUNAKAN KONFIGURASI FIREBASE YANG SAMA ===
const firebaseConfig = {
  apiKey: "API_KEY_ANDA",
  authDomain: "PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PROJECT_ID",
  storageBucket: "PROJECT_ID.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// Dengar perubahan data secara MASA NYATA
database.ref('leaderboard').on('value', (snapshot) => {
  const data = snapshot.val();
  const tbody = document.getElementById("leaderboard-body");
  tbody.innerHTML = "";

  if (!data) {
    tbody.innerHTML = "<tr><td colspan='5'>Tiada data pelajar lagi.</td></tr>";
    return;
  }

  // Susun pelajar mengikut markah tertinggi
  const students = Object.values(data).sort((a, b) => b.score - a.score);

  students.forEach((student, index) => {
    const row = document.createElement("tr");
    if (index === 0) row.className = "top-1";
    
    row.innerHTML = `
      <td>${index + 1}</td>
      <td><strong>${student.name}</strong></td>
      <td>${student.score}</td>
      <td><span style="text-transform:uppercase;">${student.level}</span></td>
      <td>${student.lastUpdate || '-'}</td>
    `;
    tbody.appendChild(row);
  });
});

function resetLeaderboard() {
  if (confirm("Adakah anda pasti untuk padam semua data leaderboard?")) {
    database.ref('leaderboard').remove();
  }
}
</script>

</body>
</html>
