function selectSubject(subject) {
  const nameInput = document.getElementById("student-name").value.trim();
  if (!nameInput) {
    alert("Sila masukkan nama penuh anda terlebih dahulu!");
    return;
  }
  
  studentName = nameInput;
  selectedSubject = subject;
  studentId = "student_" + Date.now();
  
  levelScores = { easy: 0, medium: 0, hard: 0 };
  totalScore = 0;
  currentLevel = "easy";
  currentQuestionIndex = 0;

  document.getElementById("login-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  document.getElementById("subject-badge").innerText = selectedSubject;

  updateScoreInFirebase();
  loadQuestion();
}

function updateScoreInFirebase() {
  database.ref('leaderboard/' + studentId).set({
    name: studentName,
    subject: selectedSubject,
    score: totalScore,
    level: currentLevel,
    lastUpdate: new Date().toLocaleTimeString()
  });
}

function loadQuestion() {
  answered = false;
  const qData = quizDatabase[selectedSubject][currentLevel][currentQuestionIndex];
  
  document.getElementById("level-badge").innerText = "Tahap: " + currentLevel.toUpperCase() + " (" + (currentQuestionIndex + 1) + "/10)";
  document.getElementById("question-text").innerText = qData.q;
  
  const optionsContainer = document.getElementById("options-container");
  optionsContainer.innerHTML = "";
  
  document.getElementById("note-box").style.display = "none";
  document.getElementById("next-btn").style.display = "none";

  qData.options.forEach((opt, index) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = String.fromCharCode(65 + index) + ". " + opt;
    btn.onclick = () => checkAnswer(index);
    optionsContainer.appendChild(btn);
  });
}

function checkAnswer(selectedIndex) {
  if (answered) return;
  answered = true;
  
  const qData = quizDatabase[selectedSubject][currentLevel][currentQuestionIndex];
  const noteBox = document.getElementById("note-box");
  const options = document.querySelectorAll(".option-btn");
  
  options.forEach(btn => btn.disabled = true);

  if (selectedIndex === qData.answer) {
    score++;
    options[selectedIndex].style.backgroundColor = "#2ecc71";
    options[selectedIndex].style.color = "white";
    noteBox.className = "note-box correct-note";
    noteBox.innerHTML = "<strong>Betul! 🎉</strong><br>" + qData.note;
  } else {
    options[selectedIndex].style.backgroundColor = "#e74c3c";
    options[selectedIndex].style.color = "white";
    options[qData.answer].style.backgroundColor = "#2ecc71";
    options[qData.answer].style.color = "white";
    noteBox.className = "note-box wrong-note";
    noteBox.innerHTML = "<strong>Salah! ❌</strong><br>" + qData.note;
  }
  
  levelScores[currentLevel] = score * 10;
  totalScore = levelScores.easy + levelScores.medium + levelScores.hard;
  
  updateScoreInFirebase();
  noteBox.style.display = "block";
  document.getElementById("next-btn").style.display = "inline-block";
}

function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < 10) {
    loadQuestion();
  } else {
    showLevelResult();
  }
}

function showLevelResult() {
  document.getElementById("quiz-header").style.display = "none";
  document.getElementById("options-container").style.display = "none";
  document.getElementById("note-box").style.display = "none";
  document.getElementById("next-btn").style.display = "none";
  
  const resultScreen = document.getElementById("result-screen");
  resultScreen.style.display = "block";
  
  let resultHTML = `<h2>Tahap Selesai!</h2>`;
  resultHTML += `<p>Markah Tahap Ini: <strong>${score} / 10</strong></p>`;
  resultHTML += `<p>Jumlah Markah Keseluruhan: <strong>${totalScore}</strong></p>`;
  
  if (score >= 8) {
    resultHTML += `<p style="color: green; font-weight: bold;">Syabas! Anda lulus tahap ini.</p>`;
    if (currentLevel === "easy") {
      resultHTML += `<button class="next-btn" style="display:inline-block;" onclick="startNextLevel('medium')">Maju ke Tahap Sederhana (Medium)</button>`;
    } else if (currentLevel === "medium") {
      resultHTML += `<button class="next-btn" style="display:inline-block;" onclick="startNextLevel('hard')">Maju ke Tahap Sukar (Hard)</button>`;
    } else {
      resultHTML += `<h3>Tahniah! Anda telah menguasai kesemua tahap bagi subjek ini! 🎉</h3>`;
    }
  } else {
    resultHTML += `<p style="color: red; font-weight: bold;">Anda memerlukan sekurang-kurangnya 8/10 untuk ke tahap seterusnya. Sila cuba lagi!</p>`;
    resultHTML += `<button class="next-btn" style="display:inline-block;" onclick="repeatLevel()">Ulang Tahap Ini</button>`;
  }
  
  resultScreen.innerHTML = resultHTML;
}

function startNextLevel(nextLvl) {
  currentLevel = nextLvl;
  currentQuestionIndex = 0;
  score = 0;
  resetUI();
  loadQuestion();
}

function repeatLevel() {
  score = 0;
  levelScores[currentLevel] = 0;
  totalScore = levelScores.easy + levelScores.medium + levelScores.hard;
  
  currentQuestionIndex = 0;
  resetUI();
  updateScoreInFirebase();
  loadQuestion();
}

function resetUI() {
  document.getElementById("quiz-header").style.display = "block";
  document.getElementById("options-container").style.display = "block";
  document.getElementById("result-screen").style.display = "none";
}
</script>

</body>
</html>
